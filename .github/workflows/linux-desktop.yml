name: Linux Desktop with VNC and noVNC

on:
  workflow_dispatch:
    inputs:
      VNC_PASSWORD:
        description: 'VNC Password (min 6 chars)'
        required: true
        default: 'password123'
        type: string
      SCREEN_RESOLUTION:
        description: 'Screen resolution (e.g., 1920x1080)'
        required: true
        default: '1920x1080'
        type: string

jobs:
  linux-desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Desktop Environment and VNC
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xfce4 \
            xfce4-terminal \
            xfce4-goodies \
            dbus-x11 \
            xfonts-base \
            xfonts-100dpi \
            xfonts-75dpi \
            tigervnc-standalone-server \
            tigervnc-viewer \
            tigervnc-tools \
            novnc \
            websockify \
            python3-websockify \
            curl \
            wget \
            net-tools \
            openssl \
            expect \
            --no-install-recommends
          sudo apt-get clean
          sudo apt-get autoremove -y

      - name: Setup VNC Server
        run: |
          # Create VNC config directory
          mkdir -p ~/.vnc
          
          # Set VNC password using expect to interact with vncpasswd
          VNC_PASS="${{ github.event.inputs.VNC_PASSWORD }}"
          
          # Use expect to set password interactively
          expect << EOF
          spawn vncpasswd
          expect "Password:"
          send "$VNC_PASS\r"
          expect "Verify:"
          send "$VNC_PASS\r"
          expect "Would you like to enter a view-only password"
          send "n\r"
          expect eof
          EOF
          
          # Create xstartup script for XFCE
          cat > ~/.vnc/xstartup << 'XEOF'
          #!/bin/bash
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          exec startxfce4
          XEOF
          
          chmod +x ~/.vnc/xstartup
          echo "VNC configured successfully"

      - name: Start VNC Server
        run: |
          # Kill any existing VNC sessions
          vncserver -kill :1 2>/dev/null || true
          
          # Start VNC server with specified geometry
          vncserver :1 \
            -geometry ${{ github.event.inputs.SCREEN_RESOLUTION }} \
            -depth 24 \
            -localhost no
          
          sleep 3
          
          # Verify VNC is running
          if ! pgrep -f "Xtigervnc" > /dev/null; then
            echo "Error: VNC server failed to start"
            exit 1
          fi
          
          echo "VNC server started on port 5901"

      - name: Start noVNC Server
        run: |
          # Generate self-signed SSL certificate
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout ~/.vnc/novnc.pem \
            -out ~/.vnc/novnc.pem \
            -days 1 \
            -subj "/CN=localhost" 2>/dev/null
          
          # Start websockify for noVNC
          websockify --web=/usr/share/novnc \
            --cert=$HOME/.vnc/novnc.pem \
            --ssl-only \
            -D \
            6080 \
            localhost:5901
          
          sleep 2
          
          # Verify websockify is running
          if ! pgrep -f "websockify" > /dev/null; then
            echo "Error: noVNC server failed to start"
            exit 1
          fi
          
          echo "noVNC server started on port 6080"

      - name: Setup ngrok Tunnel
        run: |
          # Download and install ngrok
          curl -sL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | sudo tar xz -C /usr/local/bin
          
          # Start ngrok tunnel for noVNC
          ngrok http 6080 --log=stdout > /tmp/ngrok.log 2>&1 &
          
          # Wait for ngrok to start
          sleep 15
          
          # Get the public URL with retries
          for i in 1 2 3 4 5; do
            NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | grep -o '"public_url":"https://[^"]*' | grep -o 'https://[^"]*' | head -1)
            if [ ! -z "$NGROK_URL" ]; then
              break
            fi
            echo "Waiting for ngrok... attempt $i"
            sleep 5
          done
          
          if [ -z "$NGROK_URL" ]; then
            echo "Error: Could not get ngrok URL"
            cat /tmp/ngrok.log
            exit 1
          fi
          
          echo ""
          echo "========================================"
          echo "🖥️  LINUX DESKTOP READY!"
          echo "========================================"
          echo ""
          echo "🔗 Web Browser Access (noVNC):"
          echo "   $NGROK_URL/vnc.html"
          echo ""
          echo "📋 Connection Details:"
          echo "   Password: ${{ github.event.inputs.VNC_PASSWORD }}"
          echo "   Resolution: ${{ github.event.inputs.SCREEN_RESOLUTION }}"
          echo ""
          echo "⚠️  IMPORTANT: Click 'Advanced' -> 'Proceed' if you see a SSL warning"
          echo ""
          echo "⏱️  Session will remain active for 6 hours"
          echo "========================================"
          echo ""

      - name: Keep runner alive
        run: |
          echo "Desktop is running. Keeping alive for 6 hours..."
          for i in $(seq 1 720); do
            sleep 30
            if [ $((i % 4)) -eq 0 ]; then
              minutes=$((i * 30 / 60))
              hours=$((minutes / 60))
              remaining_minutes=$((minutes % 60))
              echo "[$(date '+%H:%M:%S')] Running for ${hours}h ${remaining_minutes}m"
            fi
          done
          echo "Maximum runtime reached. Shutting down..."
